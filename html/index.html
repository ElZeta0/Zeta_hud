<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP Academy HUD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main id="hud" class="hud">
        <section class="logo-server" id="logoServer">
            <img id="logoImmagine" src="img/logo.png" alt="Logo ESP Academy">
        </section>

        <section class="stato-giocatore" id="statoGiocatore">
            <div class="barra-stato" id="barraVitas">
                <div class="icona-stato icona-vita">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/></svg>
                </div>
                <div class="contenuto-barra">
                    <div class="riga-etichetta">
                        <span></span>
                        <strong id="valoreVita">100%</strong>
                    </div>
                    <div class="traccia"><div id="barraVita" class="riempimento vita"></div></div>
                </div>
            </div>

            <div class="barra-stato" id="nascArmatura">
                <div class="icona-stato icona-armatura">
                    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 4 5v6c0 5.2 3.4 9.3 8 11 4.6-1.7 8-5.8 8-11V5l-8-3Zm0 4 4 1.5V11c0 3.2-1.6 5.8-4 7.2-2.4-1.4-4-4-4-7.2V7.5L12 6Z"/></svg>
                </div>
                <div class="contenuto-barra">
                    <div class="riga-etichetta">
                        <span></span>
                        <strong id="valoreArmatura">0%</strong>
                    </div>
                    <div class="traccia"><div id="barraArmatura" class="riempimento armatura"></div></div>
                </div>
            </div>
            <div class="idPlayer">
                <span class="id">#<span id="id"></span></span>
            </div>
        </section>

        <section id="contachilometri" class="contachilometri">
            <div class="velocita-numero" id="velocita">0</div>
            <div class="velocita-unita">KM/H</div>
            <div class="velocita-linea"></div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
